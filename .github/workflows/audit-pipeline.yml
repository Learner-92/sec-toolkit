name: Security Toolkit CI/CD & SAST Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Code Quality & Static Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 semgrep pytest

      - name: Lint Codebase (Syntax & PEP8 Standards)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Run Semgrep SAST Scan (OWASP Top 10 Security Rules)
        continue-on-error: true
        run: |
          semgrep scan --config auto --error

      - name: Verify Docker Container Build
        run: |
          docker build -t sectoolkit:latest .